<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Technical Doc Formatter</title>
    
    <!-- Marked for rendering the visual preview -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Highlight.js for IDE coloring -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px auto;
            max-width: 1000px;
            background-color: #f6f8fa;
        }
        h1.app-title {
            margin-bottom: 20px;
            color: #24292f;
        }
        .controls {
            background: #ffffff;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #d0d7de;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 250px;
            font-family: monospace;
            font-size: 14px;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
            margin-top: 10px;
            border: 1px solid #d0d7de;
            border-radius: 4px;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 10px;
            margin-top: 15px;
            border: 1px solid rgba(27,31,36,0.15);
            border-radius: 6px;
            background-color: #2da44e;
            color: white;
        }
        button.secondary {
            background-color: #f6f8fa;
            color: #24292f;
        }
        button.pdf-btn {
            background-color: #0969da;
            color: white;
        }
        button:active {
            opacity: 0.8;
        }

        .preview-container {
            display: none;
            margin-top: 30px;
        }
        
        .preview {
            background: #ffffff;
            padding: 40px;
            border-radius: 6px;
            border: 1px solid #d0d7de;
            box-shadow: 0 3px 6px rgba(140,149,159,0.15);
            
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: #24292f;
        }
        
        .preview h1, .preview h2 {
            border-bottom: 1px solid #d0d7de;
            padding-bottom: 0.3em;
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
        }
        .preview h1 { font-size: 2em; }
        .preview h2 { font-size: 1.5em; }
        .preview h3 { font-size: 1.25em; margin-top: 24px; margin-bottom: 16px; font-weight: 600; }
        
        .preview p, .preview ul, .preview ol {
            margin-top: 0;
            margin-bottom: 16px;
        }
        .preview ul, .preview ol { padding-left: 2em; }
        
        .preview blockquote {
            margin: 0 0 16px 0;
            padding: 0 1em;
            color: #57606a;
            border-left: 0.25em solid #d0d7de;
        }
        
        .preview table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 16px;
        }
        .preview table th, .preview table td {
            padding: 6px 13px;
            border: 1px solid #d0d7de;
        }
        .preview table tr:nth-child(2n) { background-color: #f6f8fa; }

        .preview code {
            background-color: rgba(175, 184, 193, 0.2);
            padding: 0.2em 0.4em;
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 85%;
        }

        /* Fix 2: Force wrapping inside code blocks instead of scrolling */
        .preview pre {
            background-color: #24292e !important;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
            line-height: 1.45;
            white-space: pre-wrap !important;
            word-wrap: break-word !important;
        }
        .preview pre code {
            background-color: transparent;
            padding: 0;
            font-size: 14px;
            color: #e1e4e8; 
            white-space: pre-wrap !important;
            word-wrap: break-word !important;
        }

        /* Styles for printing/saving to PDF */
        @media print {
            body { 
                background: white; 
                margin: 0; 
                padding: 0; 
            }
            /* Hide everything except the actual document preview */
            .controls, .app-title, .action-row { 
                display: none !important; 
            }
            .preview-container { 
                margin: 0; 
            }
            .preview { 
                padding: 0; 
                border: none; 
                box-shadow: none; 
            }
        }
    </style>
</head>
<body>

    <h1 class="app-title">Technical Doc Formatter</h1>
    
    <div class="controls">
        <label><strong>1. Paste your Text or Markdown here</strong></label>
        <br>
        <textarea id="textInput" placeholder="Paste your raw text or code here..."></textarea>
        
        <br>
        <button onclick="processText()">Format Document</button>
    </div>

    <div id="previewContainer" class="preview-container">
        <div class="action-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <label><strong>Documentation Output</strong></label>
            <div>
                <button class="pdf-btn" onclick="window.print()">Save as PDF</button>
                <button class="secondary" onclick="copyForWord()" id="copyBtn">Copy for MS Word</button>
            </div>
        </div>
        <div id="previewOutput" class="preview"></div>
    </div>

    <script>
        marked.setOptions({
            breaks: true,
            gfm: true,
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            }
        });

        function processText() {
            const inputText = document.getElementById("textInput").value;
            if (!inputText.trim()) return;

            const htmlPreview = marked.parse(inputText);
            document.getElementById("previewOutput").innerHTML = htmlPreview;
            document.getElementById("previewContainer").style.display = "block";
        }

        // Fix 1: Bake the CSS directly into the HTML elements so Word doesn't strip it out
        function copyForWord() {
            const original = document.getElementById('previewOutput');
            const clone = original.cloneNode(true);
            
            // Get all elements in original and clone
            const originalElements = original.querySelectorAll('*');
            const clonedElements = clone.querySelectorAll('*');
            
            // Apply computed styles inline
            for (let i = 0; i < originalElements.length; i++) {
                const computed = window.getComputedStyle(originalElements[i]);
                clonedElements[i].style.color = computed.color;
                clonedElements[i].style.backgroundColor = computed.backgroundColor;
                clonedElements[i].style.fontFamily = computed.fontFamily;
                clonedElements[i].style.fontSize = computed.fontSize;
                clonedElements[i].style.fontWeight = computed.fontWeight;
                clonedElements[i].style.padding = computed.padding;
                clonedElements[i].style.margin = computed.margin;
                clonedElements[i].style.border = computed.border;
                clonedElements[i].style.borderRadius = computed.borderRadius;
                
                // Keep the text wrapping intact for Word
                if (originalElements[i].tagName === 'PRE' || originalElements[i].tagName === 'CODE') {
                    clonedElements[i].style.whiteSpace = 'pre-wrap';
                    clonedElements[i].style.wordWrap = 'break-word';
                }
            }

            // Create a hidden off-screen div to hold the inline-styled clone
            const hiddenDiv = document.createElement('div');
            hiddenDiv.style.position = 'absolute';
            hiddenDiv.style.left = '-9999px';
            hiddenDiv.appendChild(clone);
            document.body.appendChild(hiddenDiv);
            
            // Select the hidden clone
            const selection = window.getSelection();
            const range = document.createRange();
            range.selectNodeContents(clone);
            
            selection.removeAllRanges();
            selection.addRange(range);
            
            try {
                // Execute the copy
                document.execCommand('copy');
                
                const btn = document.getElementById('copyBtn');
                const originalText = btn.innerText;
                btn.innerText = "Successfully Copied!";
                btn.style.backgroundColor = "#2da44e";
                btn.style.color = "white";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = "";
                    btn.style.color = "";
                }, 2000);
                
            } catch (err) {
                alert('Copy failed. Your browser might be blocking clipboard access.');
            }
            
            // Clean up the hidden element
            selection.removeAllRanges();
            document.body.removeChild(hiddenDiv);
        }
    </script>
</body>
</html>
